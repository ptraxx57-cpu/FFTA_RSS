name: Générer RSS FFTA - Résultats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Générer le RSS des résultats
        env:
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
        run: |
          python Generation-RSS-FFTA_Resultats-Competitions.py

      - name: Vérifier le fichier généré
        run: |
          ls -la
          echo "--------------------------------"
          echo "Fichier RSS :"
          cat FFTA_Resultats.xml

      - name: Enregistrer le RSS dans GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add FFTA_Resultats.xml

          if git diff --cached --quiet; then
            echo "Aucune modification du RSS."
          else
            git commit -m "Mise à jour des résultats"
            git push
          fi
